<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-label="Amadegi Muharram">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2e28"/>
      <stop offset="40%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <pattern id="lattice" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 20 H40 M20 0 V40" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="480" height="640" fill="url(#bg)"/>
  <rect width="480" height="640" fill="url(#lattice)"/>
  <circle cx="420" cy="90" r="100" fill="#fef3c7" fill-opacity="0.08"/>
  <circle cx="50" cy="560" r="90" fill="#fde68a" fill-opacity="0.1"/>
  <!-- solemn geometric banner / standard -->
  <g fill="none" stroke="#fef3c7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M240 120 v280"/>
    <path d="M240 160 L320 210 L240 260 L160 210 Z"/>
    <path d="M240 200 L280 225 L240 250 L200 225 Z"/>
    <circle cx="240" cy="210" r="12"/>
  </g>
  <g fill="none" stroke="#fbbf24" stroke-opacity="0.85" stroke-width="4" stroke-linecap="round">
    <path d="M160 420 h160"/>
    <path d="M180 450 h120"/>
    <path d="M200 480 h80"/>
  </g>
</svg>
