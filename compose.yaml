name: safanoor
x-api: &api
  build:
    context: .
    dockerfile: api/Dockerfile
  env_file: api/.env
  environment: &api-env
    DATABASE_URL: postgresql://safanoor_app:${DB_APP_PASSWORD}@postgres:5432/safanoor
    APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
    STORAGE_DRIVER: s3
    S3_ENDPOINT: http://storage:9000
    S3_PUBLIC_ENDPOINT: http://localhost:9000
    S3_BUCKET: safanoor
    S3_ACCESS_KEY: ${S3_ACCESS_KEY}
    S3_SECRET_KEY: ${S3_SECRET_KEY}
  restart: unless-stopped
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: safanoor_owner
      POSTGRES_DB: safanoor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./infra/postgres-init.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U safanoor_owner -d safanoor]
      interval: 5s
      retries: 20
  storage:
    build: {context: infra/storage}
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports: [127.0.0.1:9000:9000]
    volumes: [storage:/data]
  storage-init:
    <<: *api
    command: [node, /app/api/init-storage.cjs]
    volumes: [./infra/init-storage.cjs:/app/api/init-storage.cjs:ro]
    restart: 'no'
    depends_on: [storage]
  migrate:
    <<: *api
    environment:
      <<: *api-env
      DATABASE_URL: postgresql://safanoor_owner:${POSTGRES_PASSWORD}@postgres:5432/safanoor
    command: [node, node_modules/typeorm/cli.js, migration:run, -d, dist/libs/database/data-source.js]
    restart: 'no'
    depends_on:
      postgres: {condition: service_healthy}
  backend:
    <<: *api
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 10
  worker:
    <<: *api
    command: [node, dist/worker.js]
    depends_on:
      backend: {condition: service_healthy}
  frontend:
    build: {context: ., dockerfile: ui/Dockerfile}
    environment:
      API_INTERNAL_URL: http://backend:3001
    depends_on:
      backend: {condition: service_healthy}
  proxy:
    image: nginx:1.28-alpine
    ports: [127.0.0.1:8080:80]
    volumes: [./infra/nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on: [frontend, backend]
volumes:
  postgres:
  storage:
