image: node:24-bookworm
services:
  - name: postgres:17-alpine
    alias: postgres
variables:
  POSTGRES_USER: safanoor
  POSTGRES_PASSWORD: ci_password
  POSTGRES_DB: safanoor
  DATABASE_URL: postgresql://safanoor:ci_password@postgres:5432/safanoor
  TEST_DATABASE_URL: postgresql://safanoor:ci_password@postgres:5432/safanoor_test
  APP_ORIGIN: http://localhost:3033
  CI: 'true'
stages: [verify]
phase-one:
  stage: verify
  before_script:
    - npm ci
    - npm ci --prefix packages/shared
    - npm run build:shared
    - npm ci --prefix api
    - corepack enable
    - cd ui && yarn install --frozen-lockfile --non-interactive && cd ..
    - node scripts/dev-env.mjs
    - npx playwright install --with-deps chromium
  script:
    - npm --prefix api run migration:run
    - npm --prefix api run seed
    - npm --prefix api run seed
    - node scripts/check.mjs
    - git diff --exit-code -- api/openapi.json ui/src/api/generated/schema.d.ts
    - npm --prefix api run build
    - npm --prefix api run start:prod > /tmp/api.log 2>&1 &
    - npm --prefix api run worker:prod > /tmp/worker.log 2>&1 &
    - cd ui && yarn dev > /tmp/ui.log 2>&1 &
    - node scripts/wait-ready.mjs
    - npm run test:worker
    - npm run test:e2e
  artifacts:
    when: always
    paths: [docs/screens/, test-results/]
    expire_in: 14 days
